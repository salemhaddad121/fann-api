<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>fann — Availability Calendar</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#0B1D51;background:#FFFFFF}
.wm{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.wm-svg{width:100%;height:100%;position:absolute;inset:0}
.pg{background:#FFFFFF;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#FFFFFF;border-bottom:0.5px solid #E2EAF5;position:sticky;top:0;z-index:50}
.logo{font-size:16px;font-weight:700;color:#0B1D51;letter-spacing:-.3px}.logo span{color:#2B52E8}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;color:#4B5A7A;cursor:pointer;position:relative;border:0.5px solid #E2EAF5}
.notif-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#EF4444;border:1.5px solid #FFFFFF}
.nav-av-art{width:34px;height:34px;border-radius:50%;background:#EEF2FE;color:#1E3A8A;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:0.5px solid #93ADE8}
.nav-av-bkr{width:34px;height:34px;border-radius:50%;background:#E0F2FE;color:#075985;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:0.5px solid #38BDF8}
.nav-av-admin{width:34px;height:34px;border-radius:50%;background:#F4F7FF;color:#0B1D51;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:0.5px solid #C5D3EE}
.admin-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px;background:#FEF3C7;color:#92400E;border:0.5px solid #F59E0B}
.topbar{display:flex;align-items:center;gap:10px;padding:11px 16px;background:#FFFFFF;border-bottom:0.5px solid #E2EAF5}
.back{display:flex;align-items:center;gap:6px;font-size:13px;color:#4B5A7A;cursor:pointer}
.topbar-title{font-size:16px;font-weight:600;flex:1;color:#0B1D51}
/* cards */
.card{background:#FFFFFF;border:0.5px solid #E2EAF5;border-radius:14px;overflow:hidden;cursor:pointer}
/* chips */
.chip{flex-shrink:0;padding:5px 13px;border-radius:20px;font-size:12px;border:0.5px solid #DDE5F5;cursor:pointer;background:#FFFFFF;color:#4B5A7A}
.chip.on-art{background:#EEF2FE;color:#1E3A8A;border-color:#93ADE8;font-weight:600}
.chip.on-bkr{background:#E0F2FE;color:#075985;border-color:#38BDF8;font-weight:600}
.chip.on{background:#EEF2FE;color:#1E3A8A;border-color:#93ADE8;font-weight:600}
/* search */
.search-wrap{display:flex;align-items:center;gap:8px;padding:8px 12px;border:0.5px solid #DDE5F5;border-radius:10px;background:#F4F7FF}
.search-wrap input{flex:1;border:none;outline:none;font-size:13px;background:transparent;color:#0B1D51}
.search-wrap i{color:#8A9BC0;font-size:15px}
/* bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#FFFFFF;border-top:0.5px solid #E2EAF5;display:flex;z-index:60}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px 10px;cursor:pointer;font-size:10px;color:#8A9BC0;gap:3px;position:relative}
.bn-item.active-art{color:#2B52E8}
.bn-item.active-bkr{color:#0284C7}
.bn-item i{font-size:20px}
.msg-badge{position:absolute;top:6px;right:calc(50% - 18px);background:#EF4444;color:#fff;font-size:9px;padding:1px 4px;border-radius:8px;font-weight:600}
/* buttons */
.btn-primary-art{padding:11px;background:#2B52E8;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary-bkr{padding:11px;background:#0B1D51;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-ghost{padding:11px;background:transparent;color:#0B1D51;border:1.5px solid #0B1D51;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-sm-approve{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:0.5px solid #86EFAC;background:#DCFCE7;color:#166534}
.btn-sm-reject{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:0.5px solid #FCA5A5;background:#FEF2F2;color:#7F1D1D}
.btn-sm-suspend{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:0.5px solid #FCD34D;background:#FEF3C7;color:#92400E}
.btn-sm-ghost{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:0.5px solid #C5D3EE;background:#F4F7FF;color:#4B5A7A}
/* status badges */
.s-active{background:#DCFCE7;color:#166534;font-size:10px;font-weight:600;padding:3px 9px;border-radius:8px}
.s-pending{background:#FEF3C7;color:#92400E;font-size:10px;font-weight:600;padding:3px 9px;border-radius:8px}
.s-rejected{background:#FEF2F2;color:#7F1D1D;font-size:10px;font-weight:600;padding:3px 9px;border-radius:8px}
.s-suspended{background:#F1F5F9;color:#334155;font-size:10px;font-weight:600;padding:3px 9px;border-radius:8px}
/* section */
.section{padding:14px 16px 0}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title{font-size:13px;font-weight:700;color:#0B1D51}
.sec-link-art{font-size:12px;color:#2B52E8;cursor:pointer;font-weight:500}
.sec-link-bkr{font-size:12px;color:#0284C7;cursor:pointer;font-weight:500}
.group-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#8A9BC0;padding:10px 16px 4px;background:#F4F7FF}
/* tab bar */
.tab-bar{display:flex;gap:4px;padding:8px 16px 0;border-bottom:0.5px solid #E2EAF5;background:#FFFFFF;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.tab{font-size:11px;padding:5px 10px;border-radius:8px;cursor:pointer;border:0.5px solid #E2EAF5;color:#8A9BC0;background:transparent;white-space:nowrap}
.tab.on{background:#F4F7FF;color:#0B1D51;font-weight:600;border-color:#C5D3EE}
/* toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0B1D51;color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;z-index:200;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1}
/* available badge */
.avail-badge{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;background:#FFFFFF;color:#166534;border:1.5px solid #86EFAC}
.avail-dot{width:6px;height:6px;border-radius:50%;background:#22C55E}
/* skel */
.skel{background:#F4F7FF;border-radius:6px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
/* tile grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 100px}
.tile{background:#FFFFFF;border:0.5px solid #E2EAF5;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.tile.hidden{display:none}
.tile-img-wrap{position:relative;width:100%;padding-top:40%}
.tile-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
div.tile-img{position:absolute;inset:0}
.tile-cat-badge{position:absolute;bottom:6px;left:6px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:8px}
.tile-body{flex:1;padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.tile-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#0B1D51}
.tile-sub{font-size:10px;color:#4B5A7A}
.tile-tag{font-size:10px;color:#8A9BC0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tile-footer{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.tile-activity{font-size:10px;color:#166534;display:flex;align-items:center;gap:3px}
.tile-msg-art{width:28px;height:28px;border-radius:50%;background:#2B52E8;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tile-msg-bkr{width:28px;height:28px;border-radius:50%;background:#0284C7;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.page-dots{display:flex;gap:5px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:#DDE5F5;cursor:pointer;transition:all .15s}
.dot.on-art{background:#2B52E8;width:16px;border-radius:3px}
.dot.on-bkr{background:#0284C7;width:16px;border-radius:3px}
.results-meta{padding:10px 16px 4px;font-size:12px;color:#8A9BC0}
/* action bar */
.action-bar{position:fixed;bottom:64px;left:0;right:0;background:#FFFFFF;border-top:0.5px solid #E2EAF5;padding:10px 16px;display:flex;gap:8px;z-index:55}
/* toggle */
.tog{width:40px;height:22px;border-radius:11px;position:relative;cursor:pointer;flex-shrink:0;transition:background .15s}
.tog.on{background:#2B52E8}
.tog.off{background:#DDE5F5}
.tog-thumb{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on .tog-thumb{left:20px}
.tog.off .tog-thumb{left:2px}

.pb-body{padding-bottom:80px}
/* ── Phone frame for desktop preview ───────────────── */
html{background:#DDE5F5;min-height:100vh}
body{
  display:flex;justify-content:center;align-items:flex-start;
  padding:24px 0 48px;min-height:100vh;background:#DDE5F5
}
#phone{
  width:390px;flex-shrink:0;
  background:#FFFFFF;
  border-radius:44px;
  box-shadow:0 24px 80px rgba(11,29,81,.18),0 0 0 1px rgba(11,29,81,.06);
  overflow:hidden;
  position:relative;
  /* scroll container */
  height:844px;
  display:flex;flex-direction:column;
}
/* notch bar */
#notch{
  height:44px;flex-shrink:0;
  background:#FFFFFF;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
  border-bottom:0.5px solid #E2EAF5;
}
#notch-time{font-size:13px;font-weight:600;color:#0B1D51}
#notch-icons{display:flex;gap:5px;align-items:center;color:#0B1D51;font-size:12px}
/* scrollable content area */
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
#scroll::-webkit-scrollbar{display:none}
/* re-anchor fixed elements inside the phone */
.bottom-nav,.action-bar,.toast,.tab-bar-fixed{
  position:sticky!important;
  bottom:0!important;left:auto!important;right:auto!important;
  width:100%!important;
}
/* watermark stays fixed inside scroll */
.wm{position:absolute!important;z-index:50}
/* sticky navbars work naturally inside scroll */
@media(max-width:430px){
  html{background:#FFFFFF;padding:0}
  body{padding:0;display:block}
  #phone{width:100%;border-radius:0;height:auto;box-shadow:none}
  #notch{display:none}
  #scroll{height:auto;overflow:visible}
  .bottom-nav,.action-bar{position:fixed!important}
  .wm{position:fixed!important}
}

</style>
</head>

<style>
.cal-pg{background:#FFFFFF;min-height:100vh;display:flex;flex-direction:column;padding-bottom:80px}
.dow{text-align:center;font-size:11px;color:#8A9BC0;padding:4px 0;font-weight:600}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;cursor:pointer;border:1.5px solid transparent;transition:background .12s;color:#0B1D51}
.day:hover{background:#F4F7FF}
.day.today{border-color:#2B52E8;color:#2B52E8;font-weight:700}
.day.unavail{background:#FEF2F2;color:#7F1D1D}
.day.booked{background:#EEF2FE;color:#1E3A8A;font-weight:600}
.day.past{color:#C5D3EE;cursor:default}
.day.past:hover{background:transparent}
.day.empty{cursor:default}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#4B5A7A}
.leg-dot{width:10px;height:10px;border-radius:50%}
.blocked-row{background:#FFFFFF;border:0.5px solid #E2EAF5;border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px}
.blocked-del{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#8A9BC0;cursor:pointer;font-size:15px;border:0.5px solid #E2EAF5}
.blocked-del:hover{background:#FEF2F2;color:#EF4444;border-color:#FCA5A5}
</style>
<div class="cal-pg">

<script>
const today=new Date();let viewYear=today.getFullYear(),viewMonth=today.getMonth();
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
let unavailDates=new Set(),bookedDates=new Set();
function dateKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function initData(){const y=today.getFullYear(),m=today.getMonth();[[y,m,8],[y,m,9],[y,m,10],[y,m,17],[y,m,18],[y,m,25]].forEach(([yr,mo,d])=>unavailDates.add(dateKey(yr,mo,d)));[[y,m,14],[y,m,21],[y,m,22]].forEach(([yr,mo,d])=>bookedDates.add(dateKey(yr,mo,d)));}
function renderCal(){
  const grid=document.getElementById('cal-grid');grid.innerHTML='';
  document.getElementById('month-label').textContent=`${MONTHS[viewMonth]} ${viewYear}`;
  const firstDay=new Date(viewYear,viewMonth,1).getDay();
  const daysInMonth=new Date(viewYear,viewMonth+1,0).getDate();
  for(let i=0;i<firstDay;i++){const e=document.createElement('div');e.className='day empty';grid.appendChild(e);}
  for(let d=1;d<=daysInMonth;d++){
    const el=document.createElement('div');const key=dateKey(viewYear,viewMonth,d);
    const isPast=new Date(viewYear,viewMonth,d)<new Date(today.getFullYear(),today.getMonth(),today.getDate());
    const isToday=d===today.getDate()&&viewMonth===today.getMonth()&&viewYear===today.getFullYear();
    let cls='day';
    if(isPast)cls+=' past';
    else if(bookedDates.has(key))cls+=' booked';
    else if(unavailDates.has(key))cls+=' unavail';
    else if(isToday)cls+=' today';
    el.className=cls;el.textContent=d;
    if(!isPast)el.onclick=()=>toggleDay(d,key,el);
    grid.appendChild(el);
  }
  renderBlocked();
}
function toggleDay(d,key,el){
  if(bookedDates.has(key)){showToast('This date has a confirmed booking');return;}
  if(unavailDates.has(key)){unavailDates.delete(key);el.className='day'+(d===today.getDate()&&viewMonth===today.getMonth()&&viewYear===today.getFullYear()?' today':'');showToast('Date marked as available');}
  else{unavailDates.add(key);el.className='day unavail';showToast('Date marked as unavailable');}
  renderBlocked();
}
function renderBlocked(){
  const list=document.getElementById('blocked-list');list.innerHTML='';
  const allBlocked=[...unavailDates].filter(k=>{const[y,m]=k.split('-').map(Number);return y*12+m>=viewYear*12+(viewMonth+1);}).sort();
  if(allBlocked.length===0){list.innerHTML='<div style="text-align:center;padding:20px;font-size:13px;color:#8A9BC0">No blocked dates. Tap any date to mark it unavailable.</div>';return;}
  let i=0;
  while(i<allBlocked.length){
    const start=allBlocked[i];let end=start;let j=i+1;
    while(j<allBlocked.length){const prev=new Date(allBlocked[j-1]+'T00:00:00');const curr=new Date(allBlocked[j]+'T00:00:00');if((curr-prev)/86400000===1){end=allBlocked[j];j++;}else break;}
    const row=document.createElement('div');row.className='blocked-row';
    const label=start===end?fmt(start):`${fmt(start)} – ${fmt(end)}`;
    const span=end===start?'1 day':`${Math.round((new Date(end+'T00:00:00')-new Date(start+'T00:00:00'))/86400000)+1} days`;
    row.innerHTML=`<div style="width:10px;height:10px;border-radius:50%;background:#FCA5A5;flex-shrink:0"></div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:#0B1D51">${label}</div><div style="font-size:11px;color:#8A9BC0">${span} blocked</div></div><div class="blocked-del" onclick="removeBlock('${start}','${end}')"><i class="ti ti-trash"></i></div>`;
    list.appendChild(row);i=j;
  }
  [...bookedDates].sort().forEach(k=>{const row=document.createElement('div');row.className='blocked-row';row.innerHTML=`<div style="width:10px;height:10px;border-radius:50%;background:#93ADE8;flex-shrink:0"></div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:#0B1D51">${fmt(k)}</div><div style="font-size:11px;color:#8A9BC0">Confirmed booking</div></div><div style="font-size:11px;color:#1E3A8A;background:#EEF2FE;padding:3px 9px;border-radius:8px;font-weight:600">Booked</div>`;list.appendChild(row);});
}
function fmt(key){const[y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function removeBlock(start,end){let cur=new Date(start+'T00:00:00');const last=new Date(end+'T00:00:00');while(cur<=last){const[y,m,d]=[cur.getFullYear(),cur.getMonth(),cur.getDate()];unavailDates.delete(dateKey(y,m,d));cur.setDate(cur.getDate()+1);}renderCal();showToast('Dates removed');}
function addBlock(){const d=today.getDate()+2;[d,d+1,d+2].forEach(dd=>{if(dd<=new Date(viewYear,viewMonth+1,0).getDate())unavailDates.add(dateKey(viewYear,viewMonth,dd));});renderCal();showToast('3 dates added');}
function changeMonth(dir){viewMonth+=dir;if(viewMonth>11){viewMonth=0;viewYear++;}if(viewMonth<0){viewMonth=11;viewYear--;}renderCal();}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
initData();renderCal();
</script>
</div>
<div class="bottom-nav">
  <div class="bn-item"><i class="ti ti-home"></i>Home</div>
  <div class="toast" id="toast"></div>
</div>
</body></html>
